ServerName localhost
ServerTokens Prod
ServerSignature Off

# Few prefork workers so the service fits in 0.5 GB of RAM (override with APACHE_MAX_WORKERS).
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          1
    MaxSpareServers          3
    ServerLimit              ${APACHE_MAX_WORKERS}
    MaxRequestWorkers        ${APACHE_MAX_WORKERS}
    MaxConnectionsPerChild   500
</IfModule>

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Health check outside the app's rewrite rules.
Alias /healthz /usr/local/share/microweber-health/healthz.php
<Directory /usr/local/share/microweber-health>
    Require all granted
</Directory>
